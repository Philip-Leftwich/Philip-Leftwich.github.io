<canvas id="flyCanvas"
        style="position:fixed; top:0; left:0; width:100vw; height:100vh;
               pointer-events:none; z-index:0;"></canvas>
<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const canvas = document.getElementById("flyCanvas");
  const ctx = canvas.getContext("2d");

  let W, H;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  function flyPos(t) {
    return {
      x: W * (0.5 + 0.42 * Math.sin(t * 0.53) * Math.cos(t * 0.21)),
      y: H * (0.5 + 0.40 * Math.sin(t * 0.83 + 1.3) * Math.cos(t * 0.37))
    };
  }

  const SPEED = 0.00035;     // lower = slower
  const TRAIL_LEN = 600;     // higher = longer persistent trail
  const DASH = 5;            // dash length (px)
  const GAP = 7;             // gap length (px)
  const PERIOD = DASH + GAP;
  let last = performance.now(), t = 0;
  let prev = flyPos(0);
  const points = [prev];

  function frame(now) {
    const dt = now - last; last = now; t += dt * SPEED;

    const p = flyPos(t);
    points.push(p);
    if (points.length > TRAIL_LEN) points.shift();

    ctx.clearRect(0, 0, W, H);

    // Static dashed trail, fading toward the rear.
    const n = points.length;
    let dist = 0;
    ctx.lineWidth = 1.5;
    ctx.lineCap = "butt";
    for (let i = 1; i < n; i++) {
      const a = points[i - 1], b = points[i];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      if (segLen === 0) continue;
      const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
      let d = 0;
      while (d < segLen) {
        const posInPeriod = (dist + d) % PERIOD;
        if (posInPeriod < DASH) {
          const dashRemain = DASH - posInPeriod;
          const drawLen = Math.min(dashRemain, segLen - d);
          const x1 = a.x + ux * d,              y1 = a.y + uy * d;
          const x2 = a.x + ux * (d + drawLen),  y2 = a.y + uy * (d + drawLen);
          const frac = i / n;
          ctx.strokeStyle = "rgba(4,108,154," + (frac * frac * 0.6) + ")";
          ctx.beginPath();
          ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.stroke();
          d += drawLen;
        } else {
          d += (PERIOD - posInPeriod);
        }
      }
      dist += segLen;
    }

    // Fly, rotated to face direction of travel (head at +x).
    // Draw order: legs -> wings -> abdomen -> thorax -> head, so legs sit
    // behind the wings and the body segments overlay the leg bases.
    const angle = Math.atan2(p.y - prev.y, p.x - prev.x);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

// --- legs: three pairs, short, from the thorax ---
    ctx.strokeStyle = "#7a5a2e";
    ctx.lineWidth = 0.8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(3.5, 1.5);  ctx.lineTo(5.5, 3.5);  ctx.lineTo(6.5, 5);
    ctx.moveTo(3.5, -1.5); ctx.lineTo(5.5, -3.5); ctx.lineTo(6.5, -5);
    ctx.moveTo(1.5, 2);    ctx.lineTo(1.2, 4);    ctx.lineTo(0.2, 5.8);
    ctx.moveTo(1.5, -2);   ctx.lineTo(1.2, -4);   ctx.lineTo(0.2, -5.8);
    ctx.moveTo(-0.5, 2);   ctx.lineTo(-3, 3.5);   ctx.lineTo(-5.5, 5);
    ctx.moveTo(-0.5, -2);  ctx.lineTo(-3, -3.5);  ctx.lineTo(-5.5, -5);
    ctx.stroke();
    ctx.lineCap = "butt";

    // --- wings: broad, held out, with medfly banding ---
    // Wings are drawn as clipped ellipses so the bands stay inside the wing.
    function medflyWing(sign) {
    // --- wings: broad, translucent, outlined ---
    ctx.fillStyle = "rgba(210,222,232,0.55)";
    ctx.strokeStyle = "rgba(140,160,175,0.65)";
    ctx.lineWidth = 0.55;
    ctx.beginPath();
    ctx.ellipse(-6, -6.5, 10.5, 4.2, 0.42, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(-6,  6.5, 10.5, 4.2, -0.42, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // faint veins
    ctx.strokeStyle = "rgba(140,160,175,0.4)";
    ctx.lineWidth = 0.4;
    ctx.beginPath();
    ctx.moveTo(-14.5, -8.5); ctx.lineTo(1.5, -4.5);
    ctx.moveTo(-13, -5.5);   ctx.lineTo(0, -7);
    ctx.moveTo(-14.5, 8.5);  ctx.lineTo(1.5, 4.5);
    ctx.moveTo(-13, 5.5);    ctx.lineTo(0, 7);
    ctx.stroke();
    }
    medflyWing(-1);
    medflyWing(1);

    // --- abdomen: tawny-ochre with two pale transverse bands ---
    ctx.fillStyle = "#c98a3c";
    ctx.beginPath(); ctx.ellipse(-6, 0, 6.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(238,226,200,0.85)";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(-4.6, -3.0); ctx.lineTo(-4.6, 3.0);
    ctx.moveTo(-7.8, -3.0); ctx.lineTo(-7.8, 3.0);
    ctx.stroke();

    // --- thorax: pale silvery-white with black blotches (diagnostic) ---
    ctx.fillStyle = "#e8e4d8";
    ctx.beginPath(); ctx.ellipse(1.5, 0, 4.4, 3.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(1.5, 0, 4.4, 3.3, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = "#26221e";
    ctx.beginPath(); ctx.ellipse(-1.2, -1.9, 2.0, 1.1, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-1.2,  1.9, 2.0, 1.1, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(2.6, -2.2, 1.3, 0.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(2.6,  2.2, 1.3, 0.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-3.4, 0, 1.4, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // --- head ---
    ctx.fillStyle = "#d8b077";
    ctx.beginPath(); ctx.arc(6.6, 0, 2.6, 0, Math.PI * 2); ctx.fill();

    // --- eyes: iridescent green-purple ---
    ctx.fillStyle = "#4a7c59";
    ctx.beginPath(); ctx.arc(7.0, -1.7, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7.0,  1.7, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(120,80,140,0.55)";
    ctx.beginPath(); ctx.arc(7.5, -2.1, 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7.5,  2.1, 0.8, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
    prev = p;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
