<canvas id="flyCanvas"
        style="position:fixed; top:0; left:0; width:100vw; height:100vh;
               pointer-events:none; z-index:0;"></canvas>
<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const canvas = document.getElementById("flyCanvas");
  const ctx = canvas.getContext("2d");

  let W, H;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  function flyPos(t) {
    return {
      x: W * (0.5 + 0.42 * Math.sin(t * 0.53) * Math.cos(t * 0.21)),
      y: H * (0.5 + 0.40 * Math.sin(t * 0.83 + 1.3) * Math.cos(t * 0.37))
    };
  }

  const SPEED = 0.00035;     // lower = slower
  const TRAIL_LEN = 600;     // higher = longer persistent trail
  const DASH = 5;            // dash length (px)
  const GAP = 7;             // gap length (px)
  const PERIOD = DASH + GAP;
  let last = performance.now(), t = 0;
  let prev = flyPos(0);
  const points = [prev];

  function frame(now) {
    const dt = now - last; last = now; t += dt * SPEED;

    const p = flyPos(t);
    points.push(p);
    if (points.length > TRAIL_LEN) points.shift();

    ctx.clearRect(0, 0, W, H);

    // Manual dashed trail: dashes placed at fixed distance intervals along the
    // stored static path, so the dashes do not crawl. Opacity fades toward the
    // old (rear) end.
    const n = points.length;
    let dist = 0;
    ctx.lineWidth = 1.5;
    ctx.lineCap = "butt";
    for (let i = 1; i < n; i++) {
      const a = points[i - 1], b = points[i];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      if (segLen === 0) continue;
      const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
      let d = 0;
      while (d < segLen) {
        const posInPeriod = (dist + d) % PERIOD;
        if (posInPeriod < DASH) {
          const dashRemain = DASH - posInPeriod;
          const drawLen = Math.min(dashRemain, segLen - d);
          const x1 = a.x + ux * d,              y1 = a.y + uy * d;
          const x2 = a.x + ux * (d + drawLen),  y2 = a.y + uy * (d + drawLen);
          const frac = i / n;                   // 0 = oldest, 1 = newest
          ctx.strokeStyle = "rgba(4,108,154," + (frac * frac * 0.6) + ")";
          ctx.beginPath();
          ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
          ctx.stroke();
          d += drawLen;
        } else {
          d += (PERIOD - posInPeriod);
        }
      }
      dist += segLen;
    }

    // Fly, rotated to face direction of travel (head at +x)
    const angle = Math.atan2(p.y - prev.y, p.x - prev.x);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

    // wings: over the abdomen (negative x, behind the head), swept backwards
    ctx.fillStyle = "rgba(120,140,150,0.45)";
    ctx.beginPath(); ctx.ellipse(-5, -5, 7, 3,  0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-5,  5, 7, 3, -0.6, 0, Math.PI * 2); ctx.fill();

    // legs
    ctx.strokeStyle = "#3a3a3d";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-1, 2); ctx.lineTo(-5, 6);
    ctx.moveTo(-3, 2); ctx.lineTo(-8, 5);
    ctx.moveTo(-1, -2); ctx.lineTo(-5, -6);
    ctx.moveTo(-3, -2); ctx.lineTo(-8, -5);
    ctx.stroke();

    // abdomen (striped)
    ctx.fillStyle = "#2c2c2e";
    ctx.beginPath(); ctx.ellipse(-4, 0, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(200,200,200,0.35)";
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(-6, -3); ctx.lineTo(-6, 3);
    ctx.moveTo(-3, -3.3); ctx.lineTo(-3, 3.3);
    ctx.stroke();

    // thorax
    ctx.fillStyle = "#1f1f21";
    ctx.beginPath(); ctx.ellipse(2, 0, 3.5, 3, 0, 0, Math.PI * 2); ctx.fill();

    // head
    ctx.fillStyle = "#161617";
    ctx.beginPath(); ctx.arc(6, 0, 2.5, 0, Math.PI * 2); ctx.fill();

    // eyes (red)
    ctx.fillStyle = "rgba(150,40,40,0.9)";
    ctx.beginPath(); ctx.arc(7, -1.4, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,  1.4, 1.1, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
    prev = p;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
